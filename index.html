<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پنل مدیریت سایبری | CYBER PANEL v2.6</title>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;500;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #00ff41; /* سبز هکری کلاسیک */
            --secondary-color: #00f3ff; /* آبی سایبرپانکی */
            --alert-color: #ff003c;
            --bg-color: #050505;
            --panel-bg: rgba(10, 15, 10, 0.85);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-color);
            color: var(--primary-color);
            font-family: 'Vazirmatn', 'Share Tech Mono', monospace;
            overflow: hidden;
            height: 100vh;
            direction: rtl;
        }

        /* پس‌زمینه ماتریکس */
        #matrix-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            opacity: 0.3;
        }

        /* افکت خطوط اسکن (Scanlines) */
        .scanlines {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(
                to bottom,
                rgba(255,255,255,0),
                rgba(255,255,255,0) 50%,
                rgba(0,0,0,0.2) 50%,
                rgba(0,0,0,0.2)
            );
            background-size: 100% 4px;
            z-index: 1000;
            pointer-events: none;
            animation: scanlineMove 10s linear infinite;
        }

        @keyframes scanlineMove {
            0% { background-position: 0 0; }
            100% { background-position: 0 100%; }
        }

        /* چیدمان اصلی */
        .container {
            display: grid;
            grid-template-columns: 280px 1fr;
            grid-template-rows: 70px 1fr;
            height: 100vh;
            padding: 20px;
            gap: 20px;
            position: relative;
            z-index: 10;
        }

        /* هدر */
        .header {
            grid-column: 1 / -1;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--primary-color);
            padding: 0 20px;
            background: var(--panel-bg);
            box-shadow: 0 0 15px rgba(0, 255, 65, 0.2);
            backdrop-filter: blur(5px);
        }

        .logo {
            font-size: 1.8rem;
            font-weight: 700;
            text-shadow: 0 0 10px var(--primary-color);
            letter-spacing: 2px;
        }

        .logo span {
            color: var(--secondary-color);
        }

        .system-time {
            font-family: 'Share Tech Mono', monospace;
            font-size: 1.2rem;
            color: var(--secondary-color);
        }

        /* سایدبار */
        .sidebar {
            background: var(--panel-bg);
            border: 1px solid var(--primary-color);
            border-radius: 8px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            box-shadow: 0 0 20px rgba(0, 255, 65, 0.1);
        }

        .menu-item {
            padding: 12px;
            border: 1px solid transparent;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .menu-item:hover, .menu-item.active {
            background: rgba(0, 255, 65, 0.1);
            border-right: 3px solid var(--primary-color);
            text-shadow: 0 0 8px var(--primary-color);
            padding-right: 20px;
        }

        .menu-item::before {
            content: '>';
            opacity: 0;
            transition: opacity 0.3s;
        }

        .menu-item:hover::before {
            opacity: 1;
        }

        /* محتوای اصلی */
        .main-content {
            display: grid;
            grid-template-rows: 1fr 1fr;
            gap: 20px;
        }

        .panel-box {
            background: var(--panel-bg);
            border: 1px solid var(--secondary-color);
            border-radius: 8px;
            padding: 20px;
            position: relative;
            overflow: hidden;
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.1);
        }

        .panel-box::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--secondary-color), transparent);
            animation: scan 3s linear infinite;
        }

        @keyframes scan {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }

        .panel-title {
            color: var(--secondary-color);
            font-size: 1.2rem;
            margin-bottom: 15px;
            border-bottom: 1px solid rgba(0, 243, 255, 0.3);
            padding-bottom: 10px;
            display: flex;
            justify-content: space-between;
        }

        /* ترمینال */
        .terminal {
            font-family: 'Share Tech Mono', monospace;
            font-size: 0.9rem;
            color: #ccc;
            height: 100%;
            overflow-y: auto;
            direction: ltr;
            text-align: left;
        }

        .terminal-line {
            margin-bottom: 5px;
            opacity: 0;
            animation: fadeIn 0.3s forwards;
        }

        .terminal-line.success { color: var(--primary-color); }
        .terminal-line.warning { color: #ffcc00; }
        .terminal-line.error { color: var(--alert-color); }
        .terminal-line.info { color: var(--secondary-color); }

        @keyframes fadeIn {
            to { opacity: 1; }
        }

        /* نوارهای وضعیت */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
        }

        .stat-item {
            text-align: center;
        }

        .stat-label {
            margin-bottom: 10px;
            font-size: 0.9rem;
            color: #aaa;
        }

        .progress-bar {
            width: 100%;
            height: 10px;
            background: #111;
            border: 1px solid #333;
            border-radius: 5px;
            overflow: hidden;
            position: relative;
        }

        .progress-fill {
            height: 100%;
            background: var(--primary-color);
            width: 0%;
            transition: width 0.5s ease;
            box-shadow: 0 0 10px var(--primary-color);
        }

        .stat-value {
            margin-top: 5px;
            font-family: 'Share Tech Mono', monospace;
            font-size: 1.1rem;
        }

        /* افکت گلیچ برای متن */
        .glitch {
            position: relative;
        }
        
        .typing-cursor::after {
            content: '█';
            animation: blink 1s infinite;
            color: var(--primary-color);
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        /* اسکرول بار سفارشی */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #000;
        }
        ::-webkit-scrollbar-thumb {
            background: var(--primary-color);
            border-radius: 4px;
        }

        /* ریسپانسیو */
        @media (max-width: 768px) {
            .container {
                grid-template-columns: 1fr;
                grid-template-rows: 60px auto 1fr;
            }
            .sidebar {
                flex-direction: row;
                overflow-x: auto;
                padding: 10px;
            }
            .stats-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

    <canvas id="matrix-canvas"></canvas>
    <div class="scanlines"></div>

    <div class="container">
        <header class="header">
            <div class="logo">NEXUS<span>_CORE</span> // پنل مدیریت</div>
            <div class="system-time" id="clock">00:00:00</div>
        </header>

        <aside class="sidebar">
            <div class="menu-item active">داشبورد اصلی</div>
            <div class="menu-item">ترمینال زنده</div>
            <div class="menu-item">تحلیل شبکه</div>
            <div class="menu-item">پایگاه داده</div>
            <div class="menu-item" style="color: var(--alert-color); margin-top: auto;">خروج اضطراری</div>
        </aside>

        <main class="main-content">
            <!-- بخش آمار سیستم -->
            <div class="panel-box">
                <div class="panel-title">
                    <span>وضعیت منابع سیستم</span>
                    <span style="font-size: 0.8rem; color: var(--primary-color);">● آنلاین</span>
                </div>
                <div class="stats-grid">
                    <div class="stat-item">
                        <div class="stat-label">پردازنده (CPU)</div>
                        <div class="progress-bar">
                            <div class="progress-fill" id="cpu-bar" style="width: 45%;"></div>
                        </div>
                        <div class="stat-value" id="cpu-text">45%</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-label">حافظه (RAM)</div>
                        <div class="progress-bar">
                            <div class="progress-fill" id="ram-bar" style="width: 62%; background: var(--secondary-color); box-shadow: 0 0 10px var(--secondary-color);"></div>
                        </div>
                        <div class="stat-value" id="ram-text">62%</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-label">ترافیک شبکه</div>
                        <div class="progress-bar">
                            <div class="progress-fill" id="net-bar" style="width: 28%; background: #ffcc00; box-shadow: 0 0 10px #ffcc00;"></div>
                        </div>
                        <div class="stat-value" id="net-text">28 MB/s</div>
                    </div>
                </div>
            </div>

            <!-- بخش ترمینال -->
            <div class="panel-box">
                <div class="panel-title">
                    <span>لاگ‌های سیستمی زنده</span>
                    <span style="font-size: 0.8rem;">root@nexus:~#</span>
                </div>
                <div class="terminal" id="terminal-output">
                    <div class="terminal-line info">> سیستم با موفقیت راه‌اندازی شد...</div>
                    <div class="terminal-line success">> اتصال به سرور امن برقرار گردید.</div>
                </div>
            </div>
        </main>
    </div>

    <script>
        // --- 1. افکت ماتریکس ---
        const canvas = document.getElementById('matrix-canvas');
        const ctx = canvas.getContext('2d');

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789@#$%^&*()آبپتثجچحخدذرزژسشصضطظعغفقکگلمنوهی';
        const fontSize = 14;
        const columns = canvas.width / fontSize;
        const drops = [];

        for (let i = 0; i < columns; i++) {
            drops[i] = 1;
        }

        function drawMatrix() {
            ctx.fillStyle = 'rgba(5, 5, 5, 0.05)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = '#00ff41';
            ctx.font = fontSize + 'px monospace';

            for (let i = 0; i < drops.length; i++) {
                const text = chars[Math.floor(Math.random() * chars.length)];
                ctx.fillText(text, i * fontSize, drops[i] * fontSize);

                if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) {
                    drops[i] = 0;
                }
                drops[i]++;
            }
        }
        setInterval(drawMatrix, 35);

        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });

        // --- 2. ساعت زنده ---
        function updateClock() {
            const now = new Date();
            const timeString = now.toLocaleTimeString('fa-IR', { hour12: false });
            document.getElementById('clock').textContent = timeString;
        }
        setInterval(updateClock, 1000);
        updateClock();

        // --- 3. شبیه‌سازی آمار سیستم ---
        function updateStats() {
            const cpu = Math.floor(Math.random() * 30) + 30; // 30-60%
            const ram = Math.floor(Math.random() * 20) + 50; // 50-70%
            const net = Math.floor(Math.random() * 50) + 10; // 10-60 MB/s

            document.getElementById('cpu-bar').style.width = cpu + '%';
            document.getElementById('cpu-text').textContent = cpu + '%';
            
            document.getElementById('ram-bar').style.width = ram + '%';
            document.getElementById('ram-text').textContent = ram + '%';
            
            document.getElementById('net-bar').style.width = (net/100*100) + '%'; // Scale for visual
            document.getElementById('net-text').textContent = net + ' MB/s';
        }
        setInterval(updateStats, 2000);

        // --- 4. تولید لاگ‌های تصادفی ترمینال ---
        const logs = [
            { text: '> اسکن پورت‌های باز... پورت 443 شناسایی شد.', type: 'info' },
            { text: '> رمزنگاری داده‌ها با پروتکل AES-256 انجام شد.', type: 'success' },
            { text: '> هشدار: تلاش ناموفق برای ورود از IP 192.168.1.45', type: 'warning' },
            { text: '> به‌روزرسانی پکت‌های شبکه...', type: 'info' },
            { text: '> خطا در اتصال به گره فرعی. تلاش مجدد...', type: 'error' },
            { text: '> دانلود پچ امنیتی تکمیل شد.', type: 'success' },
            { text: '> تحلیل ترافیک: الگوی غیرعادی شناسایی نشد.', type: 'info' },
            { text: '> اجرای اسکریپت نظارتی background_process.sh', type: 'info' }
        ];

        function addLog() {
            const terminal = document.getElementById('terminal-output');
            const randomLog = logs[Math.floor(Math.random() * logs.length)];
            
            const div = document.createElement('div');
            div.className = `terminal-line ${randomLog.type}`;
            
            // افزودن زمان به لاگ
            const now = new Date();
            const time = now.toLocaleTimeString('en-US', { hour12: false });
            div.textContent = `[${time}] ${randomLog.text}`;
            
            terminal.appendChild(div);
            
            // اسکرول خودکار به پایین
            terminal.scrollTop = terminal.scrollHeight;

            // حذف لاگ‌های قدیمی برای جلوگیری از کندی
            if (terminal.children.length > 20) {
                terminal.removeChild(terminal.children[0]);
            }
        }
        setInterval(addLog, 1500);

        // --- 5. تعامل منو ---
        const menuItems = document.querySelectorAll('.menu-item');
        menuItems.forEach(item => {
            item.addEventListener('click', function() {
                menuItems.forEach(i => i.classList.remove('active'));
                this.classList.add('active');
                
                // افکت صدای کلیک (اختیاری - فقط ویژوال)
                this.style.textShadow = '0 0 15px #fff';
                setTimeout(() => {
                    this.style.textShadow = '';
                }, 200);
            });
        });
    </script>
</body>
</html>
