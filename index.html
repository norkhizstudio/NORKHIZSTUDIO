<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>فرم ثبت‌نام</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            width: 100%;
            max-width: 500px;
            animation: slideIn 0.5s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 10px;
            font-size: 28px;
        }
        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
            position: relative;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 600;
            font-size: 14px;
        }

        input[type="text"],
        input[type="email"],
        input[type="tel"],
        input[type="password"] {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 15px;
            transition: all 0.3s ease;
            font-family: inherit;
        }

        input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        input.error {
            border-color: #e74c3c;
        }

        input.success {
            border-color: #2ecc71;
        }

        .error-message {
            color: #e74c3c;            font-size: 12px;
            margin-top: 5px;
            display: none;
        }

        .error-message.show {
            display: block;
            animation: shake 0.3s ease;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }

        .password-strength {
            margin-top: 8px;
            height: 5px;
            background: #e0e0e0;
            border-radius: 3px;
            overflow: hidden;
        }

        .strength-bar {
            height: 100%;
            width: 0;
            transition: all 0.3s ease;
            border-radius: 3px;
        }

        .strength-text {
            font-size: 12px;
            margin-top: 5px;
            color: #666;
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 25px;
        }

        input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }
        .checkbox-group label {
            margin: 0;
            font-weight: normal;
            cursor: pointer;
        }

        .checkbox-group a {
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
        }

        .checkbox-group a:hover {
            text-decoration: underline;
        }

        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: inherit;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        button:active {
            transform: translateY(0);
        }

        button:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }

        .login-link {
            text-align: center;
            margin-top: 20px;
            color: #666;
            font-size: 14px;        }

        .login-link a {
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
        }

        .login-link a:hover {
            text-decoration: underline;
        }

        @media (max-width: 480px) {
            .container {
                padding: 30px 20px;
            }

            h1 {
                font-size: 24px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>ایجاد حساب کاربری</h1>
        <p class="subtitle">برای شروع، اطلاعات خود را وارد کنید</p>
        
        <form id="registerForm" novalidate>
            <div class="form-group">
                <label for="fullName">نام و نام خانوادگی</label>
                <input type="text" id="fullName" name="fullName" placeholder="مثال: علی احمدی" required>
                <span class="error-message" id="fullNameError">لطفاً نام و نام خانوادگی خود را وارد کنید</span>
            </div>

            <div class="form-group">
                <label for="email">ایمیل</label>
                <input type="email" id="email" name="email" placeholder="example@email.com" required>
                <span class="error-message" id="emailError">لطفاً یک ایمیل معتبر وارد کنید</span>
            </div>

            <div class="form-group">
                <label for="phone">شماره موبایل</label>
                <input type="tel" id="phone" name="phone" placeholder="09123456789" required>
                <span class="error-message" id="phoneError">لطفاً شماره موبایل معتبر وارد کنید (11 رقم)</span>
            </div>

            <div class="form-group">
                <label for="password">رمز عبور</label>
                <input type="password" id="password" name="password" placeholder="حداقل 8 کاراکتر" required>                <div class="password-strength">
                    <div class="strength-bar" id="strengthBar"></div>
                </div>
                <div class="strength-text" id="strengthText"></div>
                <span class="error-message" id="passwordError">رمز عبور باید حداقل 8 کاراکتر باشد</span>
            </div>

            <div class="form-group">
                <label for="confirmPassword">تکرار رمز عبور</label>
                <input type="password" id="confirmPassword" name="confirmPassword" placeholder="رمز عبور را دوباره وارد کنید" required>
                <span class="error-message" id="confirmPasswordError">رمز عبور مطابقت ندارد</span>
            </div>

            <div class="checkbox-group">
                <input type="checkbox" id="terms" name="terms" required>
                <label for="terms">
                    <a href="#" onclick="alert('قوانین و مقررات سایت'); return false;">قوانین و مقررات</a> را می‌پذیرم
                </label>
            </div>

            <button type="submit" id="submitBtn">ثبت‌نام</button>

            <div class="login-link">
                قبلاً ثبت‌نام کرده‌اید؟ <a href="#">وارد شوید</a>
            </div>
        </form>
    </div>

    <script>
        const form = document.getElementById('registerForm');
        const fullName = document.getElementById('fullName');
        const email = document.getElementById('email');
        const phone = document.getElementById('phone');
        const password = document.getElementById('password');
        const confirmPassword = document.getElementById('confirmPassword');
        const terms = document.getElementById('terms');
        const submitBtn = document.getElementById('submitBtn');

        // Validation functions
        function validateFullName() {
            const value = fullName.value.trim();
            const isValid = value.length >= 3;
            toggleError(fullName, 'fullNameError', isValid);
            return isValid;
        }

        function validateEmail() {
            const value = email.value.trim();
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            const isValid = emailRegex.test(value);            toggleError(email, 'emailError', isValid);
            return isValid;
        }

        function validatePhone() {
            const value = phone.value.trim();
            const phoneRegex = /^09\d{9}$/;
            const isValid = phoneRegex.test(value);
            toggleError(phone, 'phoneError', isValid);
            return isValid;
        }

        function validatePassword() {
            const value = password.value;
            const isValid = value.length >= 8;
            toggleError(password, 'passwordError', isValid);
            updatePasswordStrength(value);
            return isValid;
        }

        function validateConfirmPassword() {
            const value = confirmPassword.value;
            const isValid = value === password.value && value.length > 0;
            toggleError(confirmPassword, 'confirmPasswordError', isValid);
            return isValid;
        }

        function toggleError(input, errorId, isValid) {
            const errorElement = document.getElementById(errorId);
            if (isValid) {
                input.classList.remove('error');
                input.classList.add('success');
                errorElement.classList.remove('show');
            } else {
                input.classList.remove('success');
                input.classList.add('error');
                errorElement.classList.add('show');
            }
        }

        function updatePasswordStrength(password) {
            const strengthBar = document.getElementById('strengthBar');
            const strengthText = document.getElementById('strengthText');
            
            let strength = 0;
            if (password.length >= 8) strength++;
            if (password.match(/[a-z]/) && password.match(/[A-Z]/)) strength++;
            if (password.match(/\d/)) strength++;
            if (password.match(/[^a-zA-Z0-9]/)) strength++;
            const strengthLevels = [
                { width: '0%', color: '#e0e0e0', text: '' },
                { width: '25%', color: '#e74c3c', text: 'ضعیف' },
                { width: '50%', color: '#f39c12', text: 'متوسط' },
                { width: '75%', color: '#3498db', text: 'خوب' },
                { width: '100%', color: '#2ecc71', text: 'عالی' }
            ];

            const level = strengthLevels[strength];
            strengthBar.style.width = level.width;
            strengthBar.style.background = level.color;
            strengthText.textContent = level.text;
            strengthText.style.color = level.color;
        }

        // Event listeners
        fullName.addEventListener('blur', validateFullName);
        email.addEventListener('blur', validateEmail);
        phone.addEventListener('blur', validatePhone);
        password.addEventListener('blur', validatePassword);
        password.addEventListener('input', () => {
            updatePasswordStrength(password.value);
            if (confirmPassword.value) validateConfirmPassword();
        });
        confirmPassword.addEventListener('blur', validateConfirmPassword);

        form.addEventListener('submit', function(e) {
            e.preventDefault();

            const isFullNameValid = validateFullName();
            const isEmailValid = validateEmail();
            const isPhoneValid = validatePhone();
            const isPasswordValid = validatePassword();
            const isConfirmPasswordValid = validateConfirmPassword();
            const isTermsChecked = terms.checked;

            if (!isTermsChecked) {
                alert('لطفاً قوانین و مقررات را بپذیرید');
                return;
            }

            if (isFullNameValid && isEmailValid && isPhoneValid && isPasswordValid && isConfirmPasswordValid && isTermsChecked) {
                submitBtn.disabled = true;
                submitBtn.textContent = 'در حال ثبت‌نام...';

                // Simulate API call
                setTimeout(() => {
                    alert('ثبت‌نام با موفقیت انجام شد!');
                    form.reset();
                    submitBtn.disabled = false;                    submitBtn.textContent = 'ثبت‌نام';
                    document.querySelectorAll('input').forEach(input => {
                        input.classList.remove('success', 'error');
                    });
                    document.getElementById('strengthBar').style.width = '0%';
                    document.getElementById('strengthText').textContent = '';
                }, 1500);
            }
        });
    </script>
</body>
</html>
