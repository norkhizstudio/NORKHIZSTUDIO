<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سکسی بات پیشرفته • ویدیو ویژه</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700&amp;family=Inter:wght@400;500;600&amp;display=swap');
        
        body {
            font-family: 'Vazirmatn', 'Inter', system-ui, sans-serif;
            background: linear-gradient(180deg, #0a0a0b 0%, #121214 100%);
        }
        
        .video-container {
            box-shadow: 0 25px 50px -12px rgb(0 0 0 / 0.5);
        }
        
        .neon-glow {
            box-shadow: 0 0 20px rgba(225, 29, 72, 0.3);
        }
        
        .logo-pulse {
            animation: logoPulse 4s ease-in-out infinite;
        }
    </style>
</head>
<body class="min-h-screen text-white flex items-center justify-center p-6">
    <div class="max-w-4xl w-full">
        
        <!-- Header / Logo -->
        <div class="flex justify-center mb-8">
            <div class="flex items-center gap-x-4">
                <div class="relative w-14 h-14 logo-pulse">
                    <svg width="56" height="56" viewBox="0 0 56 56" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <defs>
                            <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                                <stop offset="0%" style="stop-color:#e11d48"/>
                                <stop offset="100%" style="stop-color:#be123c"/>
                            </linearGradient>
                        </defs>
                        <rect x="4" y="4" width="48" height="48" rx="12" ry="12" fill="none" stroke="#e11d48" stroke-width="3"/>
                        <path d="M20 14 Q28 8 36 14 Q38 22 34 30 Q30 38 28 42 Q26 38 22 30 Q18 22 20 14" fill="#e11d48"/>
                        <circle cx="28" cy="18" r="5" fill="#fff"/>
                    </svg>
                    <div class="absolute -top-1 -right-1 w-5 h-5 bg-emerald-500 rounded-full border-[3px] border-zinc-950 flex items-center justify-center">
                        <div class="w-2 h-2 bg-white rounded-full animate-pulse"></div>
                    </div>
                </div>
                <div>
                    <h1 class="text-4xl font-bold tracking-tighter">سکسی بات <span class="text-red-500">پیشرفته</span></h1>
                    <p class="text-red-400/70 text-sm -mt-1">ویدیو ویژه • همیشه فعال 🔥</p>
                </div>
            </div>
        </div>

        <!-- Video Title -->
        <div class="text-center mb-6">
            <h2 class="text-3xl font-bold mb-2">همسایه مدت‌ها می‌خواست بمکه و کیرم تو پوسيش خیس بره</h2>
            <p class="text-red-400">ویدیوی درخواستی تو • پخش مستقیم داخل سایت</p>
        </div>

        <!-- The Exact Embed You Sent -->
        <div class="video-container max-w-[560px] mx-auto bg-zinc-950 border border-red-900/40 rounded-3xl overflow-hidden neon-glow">
            <iframe 
                src="https://www.pornhub.com/embed/ph60a3cb6a5ad50" 
                frameborder="0" 
                width="560" 
                height="315" 
                scrolling="no" 
                allowfullscreen
                class="w-full aspect-video">
            </iframe>
        </div>

        <!-- Footer Info -->
        <div class="mt-8 text-center">
            <div class="inline-flex items-center gap-x-2 px-6 py-2 bg-zinc-900 border border-red-900/40 rounded-2xl text-sm text-zinc-400">
                <i class="fas fa-play text-red-500"></i>
                <span>پخش داخل سایت • پورن‌هاب</span>
            </div>
            
            <p class="mt-4 text-xs text-zinc-500">
                لوگوی همیشه فعال • فقط همین ویدیو • طراحی تمیز و سکسی
            </p>
        </div>

    </div>

    <script>
        // Tailwind + subtle effects
        console.log('%c[سکسی بات] فقط همین یدونه ویدیو داخل سایت لود شد 🔥', 'color:#e11d48');
        
        // Make iframe responsive on mobile
        window.onload = function() {
            const iframe = document.querySelector('iframe');
            if (iframe) {
                iframe.style.maxWidth = '100%';
                iframe.style.height = 'auto';
                iframe.style.aspectRatio = '16 / 9';
            }
        }
    </script>
</body>
</html>
