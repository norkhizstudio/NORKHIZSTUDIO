<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NORKHIZ STUDIO | ثبت سفارش نئونی</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;700&display=swap');
        
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Vazirmatn', sans-serif;
        }

        body {
            background-color: #050505;
            background-image: radial-gradient(circle at 50% -20%, #1a0b2e, #050505);
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .neon-container {
            background: rgba(20, 20, 20, 0.6);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 40px;
            width: 100%;
            max-width: 550px;
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.1), inset 0 0 20px rgba(255, 0, 255, 0.05);
            position: relative;
            overflow: hidden;
        }

        .logo-box {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo-box img {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: 2px solid #00ffff;
            box-shadow: 0 0 15px #00ffff, 0 0 30px #00ffff;
            object-fit: cover;
        }

        .logo-box h1 {
            font-size: 1.5rem;
            margin-top: 15px;
            color: #fff;
            text-shadow: 0 0 10px #ff00ff, 0 0 20px #ff00ff;
            letter-spacing: 2px;
        }

        .form-group {
            margin-bottom: 25px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 0.9rem;
            color: #ccc;
        }

        .form-control {
            width: 100%;
            background: transparent;
            border: none;
            border-bottom: 2px solid rgba(255, 255, 255, 0.2);
            padding: 10px 5px;
            color: #fff;
            font-size: 1rem;
            transition: all 0.3s;
            outline: none;
        }

        .form-control:focus {
            border-bottom-color: #00ffff;
            box-shadow: 0 4px 10px -4px #00ffff;
        }

        .radio-group, .checkbox-group {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }

        .radio-label, .check-label {
            display: flex;
            align-items: center;
            cursor: pointer;
            font-size: 0.9rem;
            color: #ddd;
            transition: 0.3s;
        }

        .radio-label:hover, .check-label:hover {
            color: #00ffff;
            text-shadow: 0 0 5px #00ffff;
        }

        input[type="radio"], input[type="checkbox"] {
            accent-color: #ff00ff;
            margin-left: 8px;
            transform: scale(1.2);
        }

        .submit-btn {
            width: 100%;
            background: transparent;
            color: #00ffff;
            border: 2px solid #00ffff;
            padding: 15px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
            box-shadow: 0 0 10px inset transparent;
            margin-top: 10px;
        }

        .submit-btn:hover {
            background: #00ffff;
            color: #050505;
            box-shadow: 0 0 20px #00ffff, 0 0 40px #00ffff;
        }

        .alert {
            display: none;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            text-align: center;
            font-weight: bold;
        }

        .alert-success {
            background: rgba(0, 255, 128, 0.1);
            border: 1px solid #00ff80;
            color: #00ff80;
            box-shadow: 0 0 10px #00ff80;
        }

        .alert-danger {
            background: rgba(255, 0, 0, 0.1);
            border: 1px solid #ff0000;
            color: #ff0000;
            box-shadow: 0 0 10px #ff0000;
        }
    </style>
</head>
<body>

    <div class="neon-container">
        <div class="logo-box">
            <img src="https://s25.uupload.ir/files/aslidxx/IMG_20260606_142036_816.jpg" alt="Norkhiz Studio Logo">
            <h1>NORKHIZ STUDIO</h1>
        </div>

        <div id="successAlert" class="alert alert-success">درخواست شما با موفقیت در سیستم نورخیز استودیو ثبت شد!</div>
        <div id="errorAlert" class="alert alert-danger">خطا در ارسال اطلاعات. لطفاً دوباره تلاش کنید.</div>

        <form id="orderForm">
            <div class="form-group">
                <label>نام و نام خانوادگی:</label>
                <input type="text" id="name" class="form-control" required placeholder="نام خود را وارد کنید...">
            </div>

            <div class="form-group">
                <label>ماهیت درخواست (نوع شخص):</label>
                <div class="radio-group">
                    <label class="radio-label">
                        <input type="radio" name="entity" value="حقیقی (فردی)" checked required> حقیقی (فردی)
                    </label>
                    <label class="radio-label">
                        <input type="radio" name="entity" value="حقوقی (شرکتی)"> حقوقی (شرکتی/تیم)
                    </label>
                </div>
            </div>

            <div class="form-group">
                <label>شماره تماس:</label>
                <input type="tel" id="phone" class="form-control" required placeholder="09123456789">
            </div>

            <div class="form-group">
                <label>ایمیل (اختیاری):</label>
                <input type="email" id="email" class="form-control" placeholder="example@gmail.com">
            </div>

            <div class="form-group">
                <label>انتخاب خدمات (می‌توانید چند مورد انتخاب کنید):</label>
                <div class="checkbox-group">
                    <label class="check-label">
                        <input type="checkbox" name="services" value="عکاسی تخصصی"> عکاسی تخصصی
                    </label>
                    <label class="check-label">
                        <input type="checkbox" name="services" value="فیلمبرداری"> فیلمبرداری
                    </label>
                    <label class="check-label">
                        <input type="checkbox" name="services" value="ادیت و تدوین"> ادیت و تدوین
                    </label>
                </div>
            </div>

            <button type="submit" id="btnSubmit" class="submit-btn">ثبت سفارش و ارسال</button>
        </form>
    </div>

    <script>
        document.getElementById('orderForm').addEventListener('submit', function(e) {
            e.preventDefault(); // جلوگیری از ریلود شدن صفحه

            const botToken = "8108890135:AAHTAc0-kgynzUqkRWhniWFMJHXPBMMvT68";
            const chatId = "7403377873";

            // دریافت مقادیر فرم
            const name = document.getElementById('name').value;
            const entity = document.querySelector('input[name="entity"]:checked').value;
            const phone = document.getElementById('phone').value;
            const email = document.getElementById('email').value || 'ثبت نشده';
            
            // دریافت خدمات انتخاب شده
            const selectedServices = [];
            document.querySelectorAll('input[name="services"]:checked').forEach(function(checkbox) {
                selectedServices.push(checkbox.value);
            });
            const servicesText = selectedServices.length > 0 ? selectedServices.join('، ') : 'هیچکدام';

            // دکمه ثبت تغییر وضعیت بدهد
            const submitBtn = document.getElementById('btnSubmit');
            submitBtn.innerText = "در حال ارسال...";
            submitBtn.disabled = true;

            // ساخت متن نهایی برای ربات تلگرام
            let message = `🔔 <b>سفارش جدید در NORKHIZ STUDIO</b>\n\n`;
            message += `👤 <b>نام و نام خانوادگی:</b> ${name}\n`;
            message += `🏢 <b>نوع شخص:</b> ${entity}\n`;
            message += `📞 <b>شماره تماس:</b> <code>${phone}</code>\n`;
            message += `📧 <b>ایمیل:</b> ${email}\n`;
            message += `📸 <b>خدمات انتخابی:</b> ${servicesText}\n`;

            // آدرس API تلگرام
            const telegramUrl = `https://api.telegram.org/bot${botToken}/sendMessage`;

            // ارسال درخواست با fetch
            fetch(telegramUrl, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    chat_id: chatId,
                    text: message,
                    parse_mode: 'HTML'
                })
            })
            .then(response => {
                // پنهان کردن هشدارهای قبلی
                document.getElementById('successAlert').style.display = 'none';
                document.getElementById('errorAlert').style.display = 'none';

                if (response.ok) {
                    document.getElementById('successAlert').style.display = 'block';
                    document.getElementById('orderForm').reset(); // فرم خالی شود
                } else {
                    document.getElementById('errorAlert').style.display = 'block';
                }
            })
            .catch(error => {
                document.getElementById('successAlert').style.display = 'none';
                document.getElementById('errorAlert').style.display = 'block';
            })
            .finally(() => {
                submitBtn.innerText = "ثبت سفارش و ارسال";
                submitBtn.disabled = false;
            });
        });
    </script>
</body>
</html>
