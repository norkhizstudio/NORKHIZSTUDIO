<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nova Web Portal</title>
    <style>
        /* تنظیمات پایه و پس‌زمینه */
        body { 
            margin: 0; 
            padding: 0; 
            height: 100vh; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e); 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            overflow: hidden; 
        }

        /* افکت شیشه‌ای (Glassmorphism) */
        .glass-panel { 
            background: rgba(255, 255, 255, 0.03); 
            backdrop-filter: blur(20px); 
            -webkit-backdrop-filter: blur(20px);
            border-radius: 24px; 
            border: 1px solid rgba(255, 255, 255, 0.1); 
            padding: 50px; 
            width: 90%; 
            max-width: 700px; 
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5); 
            text-align: center; 
        }

        /* لوگوی نئونی با CSS */
        .logo { 
            font-size: 3.5em; 
            font-weight: 900; 
            color: #ffffff; 
            text-transform: uppercase;
            letter-spacing: 4px;
            text-shadow: 0 0 10px #00d2ff, 0 0 20px #00d2ff, 0 0 40px #3a7bd5; 
            margin-bottom: 10px; 
        }

        /* ساعت دیجیتال */
        #clock { 
            color: #a0a5b1; 
            font-size: 1.2em; 
            margin-bottom: 35px; 
            letter-spacing: 2px;
        }

        /* باکس جستجو */
        .search-box { 
            display: flex; 
            margin-bottom: 40px; 
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 0 15px rgba(0, 210, 255, 0.2);
        }

        .search-box input { 
            flex: 1; 
            padding: 18px 25px; 
            border: none; 
            background: rgba(255, 255, 255, 0.08); 
            color: #fff; 
            font-size: 1.2em; 
            outline: none; 
            transition: 0.3s; 
        }

        .search-box input:focus { 
            background: rgba(255, 255, 255, 0.15); 
        }

        .search-box input::placeholder {
            color: rgba(255,255,255,0.5);
        }

        /* دکمه سرچ نئونی */
        .search-box button { 
            padding: 0 35px; 
            border: none; 
            background: transparent; 
            color: #00d2ff; 
            border-right: 1px solid rgba(0, 210, 255, 0.3);
            background: rgba(0, 0, 0, 0.2);
            font-size: 1.2em; 
            font-weight: bold;
            cursor: pointer; 
            transition: 0.3s; 
        }

        .search-box button:hover { 
            background: #00d2ff; 
            color: #0f0c29; 
            box-shadow: 0 0 20px #00d2ff; 
        }

        /* دکمه‌های قابلیت‌های جانبی */
        .features { 
            display: flex; 
            justify-content: center; 
            gap: 20px; 
            flex-wrap: wrap;
        }

        .feature-btn { 
            padding: 12px 25px; 
            background: rgba(255, 255, 255, 0.05); 
            border: 1px solid rgba(255, 255, 255, 0.1); 
            color: #fff; 
            border-radius: 12px; 
            cursor: pointer; 
            transition: 0.3s; 
            font-size: 1em;
        }

        .feature-btn:hover { 
            background: rgba(255, 255, 255, 0.1); 
            border-color: #ff007f; 
            text-shadow: 0 0 8px #ff007f; 
            box-shadow: 0 0 15px rgba(255, 0, 127, 0.4); 
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

    <div class="glass-panel">
        <div class="logo">NOVA</div>
        <div id="clock">00:00:00</div>
        
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="در وب جستجو کنید...">
            <button onclick="performSearch()">جستجو</button>
        </div>

        <div class="features">
            <button class="feature-btn" onclick="openTool('weather')">آب و هوا</button>
            <button class="feature-btn" onclick="openTool('news')">اخبار روز</button>
            <button class="feature-btn" onclick="openTool('code')">ابزارهای توسعه</button>
            <button class="feature-btn" onclick="openTool('ai')">هوش مصنوعی</button>
        </div>
    </div>

    <script>
        // اسکریپت راه‌اندازی ساعت لایو
        function updateClock() {
            const now = new Date();
            const options = { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false };
            document.getElementById('clock').innerText = now.toLocaleTimeString('fa-IR', options);
        }
        setInterval(updateClock, 1000);
        updateClock();

        // اسکریپت جستجوی واقعی در گوگل
        function performSearch() {
            const query = document.getElementById('searchInput').value;
            if(query.trim() !== "") {
                // کلمه جستجو شده را به موتور گوگل متصل می‌کند
                window.location.href = 'https://www.google.com/search?q=' + encodeURIComponent(query);
            }
        }

        // فعال‌سازی جستجو با زدن دکمه Enter روی کیبورد
        document.getElementById('searchInput').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                performSearch();
            }
        });

        // دکمه‌های قابلیت‌های جانبی (آماده برای توسعه توسط شما)
        function openTool(type) {
            const messages = {
                'weather': 'پنجره آب و هوا به زودی از طریق API متصل می‌شود.',
                'news': 'بخش اخبار روز در حال توسعه است.',
                'code': 'پنل ابزارهای برنامه‌نویسی باز خواهد شد.',
                'ai': 'اتصال به ربات هوش مصنوعی...'
            };
            alert(messages[type]);
        }
    </script>
</body>
</html>
